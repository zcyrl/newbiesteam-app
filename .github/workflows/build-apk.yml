name: Build & Release Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Package Signed APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Verify or Generate Release Keystore
        run: |
          if [ ! -f app/release.jks ]; then
            echo "Release keystore not found in workspace, generating with keytool..."
            keytool -genkeypair -v \
              -keystore app/release.jks \
              -alias newbiesteam \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass newbiesteam2026 \
              -keypass newbiesteam2026 \
              -storetype PKCS12 \
              -dname "CN=NewbiesTeam, OU=GT 20 Pro Community, O=NewbiesTeam, L=Cairo, ST=Cairo, C=EG"
          else
            echo "Release keystore present at app/release.jks"
          fi

      - name: Print Certificate Fingerprint (For Google Play Protect Submission)
        run: |
          keytool -list -v -keystore app/release.jks -storepass newbiesteam2026

      - name: Build Signed Release APK
        run: |
          ./gradlew assembleRelease --stacktrace
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk dist/NewbiesTeam.apk

      - name: Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NewbiesTeam-APK
          path: dist/NewbiesTeam.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: NewbiesTeam Android App ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: dist/NewbiesTeam.apk
          generate_release_notes: true
          draft: false
          prerelease: false
